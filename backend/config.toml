# Realty Aggregator Configuration

[api]
# Частота сбора данных (минуты)
collect_interval_minutes = 60

# Задержка между запросами к API (секунды, минимум 5 по требованию API)
request_delay_seconds = 6

[api.sync]
# Включить синхронизацию актуальности
enabled = true

# Интервал проверки актуальности (часы)
interval_hours = 24

[api.query]
# Параметры запроса к ads-api.ru
# Документация: https://ads-api.ru/api

# Категория: 2 = Квартиры
category_id = 2

# Тип сделки: 1 = Продам, 2 = Сдам, 3 = Куплю, 4 = Сниму
nedvigimost_type = 1

# Регион поиска
city = "Кабардино-Балкария"

# Актуальность: "11,1" = только актуальные, "0" = неактуальные
is_actual = "11,1"

# Цена от (рублей)
price1 = 1400000

# Цена до (рублей)
price2 = 2100000

# Площадь от (м²)
area_from = 33

# Опциональные фильтры (раскомментировать при необходимости)
# area_to = 100            # Площадь до (м²)
# person_type = 1          # 1=частник, 2=агентство, 3=собственник
# source = "1,4"           # 1=avito, 4=cian (см. документацию)
# withcoords = 1           # Только с координатами

[storage]
# Шаблон пути для изображений в MinIO
# Доступные переменные: {listing_id}, {index}
image_path_template = "{listing_id}/{index}.jpg"

[vision]
# Включить автоматический анализ после сбора данных
# Если false - объявления останутся в статусе "pending" для ручного анализа
auto_analyze = false

# Модель для анализа изображений
model = "google/gemini-2.5-flash-lite"

# Максимум попыток анализа перед статусом "failed"
max_retries = 3

# Максимум изображений для отправки в один запрос
max_images_per_request = 10

[vision.filter]
# Фильтрация объявлений перед отправкой на vision-анализ
# Объявления, не прошедшие фильтр, получат статус "not_needed"

enabled = true

# Минимальное количество фото (объявления без фото не анализируем)
min_photos = 1

# Опциональные фильтры (раскомментировать при необходимости)
# max_photos = 20           # Максимум фото для анализа (остальные игнорируются)
# min_price = 1000000       # Минимальная цена
# max_price = 50000000      # Максимальная цена
# min_area = 20.0           # Минимальная площадь (м²)
# max_area = 200.0          # Максимальная площадь (м²)
# sources = ["avito", "cian"]  # Только указанные источники
# require_coords = false    # Требовать наличие координат
