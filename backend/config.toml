# Realty Aggregator Configuration

[api]
# Collection interval (minutes)
collect_interval_minutes = 60

# Delay between API requests (seconds, minimum 5 per API requirements)
request_delay_seconds = 6

[api.sync]
# Enable actuality sync
enabled = true

# Actuality check interval (hours)
interval_hours = 24

[api.query]
# API query parameters
# Docs: https://ads-api.ru/api

# Category: 2 = Apartments
category_id = 2

# Deal type: 1 = Sell, 2 = Rent, 3 = Buy, 4 = Want to rent
nedvigimost_type = 1

# Search region
city = "Кабардино-Балкария"

# Actuality: "11,1" = only actual, "0" = not actual
is_actual = "11,1"

# Price from (RUB)
price1 = 1400000

# Price to (RUB)
price2 = 2100000

# Area from (m²)
area_from = 33

# Optional filters (uncomment if needed)
# area_to = 100            # Area to (m²)
# person_type = 1          # 1=private, 2=agency, 3=owner
# source = "1,4"           # 1=avito, 4=cian (see docs)
# withcoords = 1           # Only with coordinates

[storage]
# Image path template in MinIO
# Available variables: {listing_id}, {index}
image_path_template = "{listing_id}/{index}.jpg"

[vision]
# OpenAI-compatible API. Credentials stay in the named environment variable.
api_base_url = "https://aiproxy.okhsunrog.ru/v1"
api_key_env = "MY_AI_PROXY"

# Enable automatic analysis after data collection
# If false - listings will wait for manual analysis trigger
auto_analyze = true

# Model for per-image analysis (first layer)
image_model = "gpt-6-luna"

# Model for listing-level analysis (second layer)
listing_model = "gpt-6-luna"

# Max attempts before "failed" status
max_retries = 3

[vision.filter]
# Filter listings before sending to vision analysis
# Listings not passing filter will be skipped

enabled = true

# Minimum number of photos (listings without photos are not analyzed)
min_photos = 1

# Optional filters (uncomment if needed)
# max_photos = 20           # Max photos to analyze (rest ignored)
# min_price = 1000000       # Minimum price
# max_price = 50000000      # Maximum price
# min_area = 20.0           # Minimum area (m²)
# max_area = 200.0          # Maximum area (m²)
# sources = ["avito", "cian"]  # Only specified sources
# require_coords = false    # Require coordinates
