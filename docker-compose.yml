services:
  postgres:
    image: postgres:17
    container_name: realty-postgres
    environment:
      POSTGRES_USER: realty
      POSTGRES_PASSWORD: realty_dev_password
      POSTGRES_DB: realty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty -d realty"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: realty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: realty
      MINIO_ROOT_PASSWORD: realty_dev_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
